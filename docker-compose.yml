services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: master-endurance-app
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PUBLIC_HOST: ${PUBLIC_HOST:-andrestrainer.qzz.io}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-andrestrainer.qzz.io,localhost,127.0.0.1,app}
    ports:
      - "${APP_PORT:-5001}:5001"
    volumes:
      - master_endurance_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:5001/api/health'))['status']=='ok'"]
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  master_endurance_data:
    name: master_endurance_data
